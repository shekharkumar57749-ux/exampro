{% extends "base.html" %}

{% block title %}500 – Internal Server Error{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem;">
    <div>
        <h1 style="font-size: 6rem; font-weight: 900; color: var(--warning); line-height: 1;">500</h1>
        <h2 style="font-size: 1.75rem; margin: 1rem 0 0.5rem;">Server Encountered an Error</h2>
        <p style="color: var(--text-muted); max-width: 480px; margin: 0 auto 2rem;">
            An unexpected error occurred while processing the request. Technical logs have been updated.
        </p>
        <a href="/" class="btn btn-primary btn-lg"><i class="fas fa-home"></i> Return to Homepage</a>
    </div>
</div>
{% endblock %}
