{% extends "base.html" %}

{% block content %}
<div class="app-layout">
    <!-- Teacher Sidebar -->
    <aside class="app-sidebar">
        <div class="sidebar-header">
            <a href="{{ url_for('teacher.dashboard') }}" class="sidebar-brand">
                <span class="brand-icon" style="background:linear-gradient(135deg, var(--secondary), #3730a3);"><i class="fas fa-chalkboard-teacher"></i></span>
                <span>Exam<span style="color:var(--secondary)">Pro</span></span>
            </a>
            <button class="sidebar-collapse-btn" title="Collapse Sidebar">
                <i class="fas fa-chevron-left"></i>
            </button>
        </div>

        <div class="sidebar-role-pill" style="color: #a5b4fc;">
            <i class="fas fa-chalkboard-teacher"></i>
            <span>Educator Portal</span>
        </div>

        <ul class="sidebar-nav">
            <li>
                <a href="{{ url_for('teacher.dashboard') }}" class="sidebar-link {% block nav_dashboard %}{% endblock %}">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="{{ url_for('teacher.exams') }}" class="sidebar-link {% block nav_exams %}{% endblock %}">
                    <i class="fas fa-file-signature"></i>
                    <span>Manage Exams</span>
                </a>
            </li>
            <li>
                <a href="{{ url_for('teacher.questions') }}" class="sidebar-link {% block nav_questions %}{% endblock %}">
                    <i class="fas fa-layer-group"></i>
                    <span>Question Bank</span>
                </a>
            </li>
            <li>
                <a href="{{ url_for('teacher.results') }}" class="sidebar-link {% block nav_results %}{% endblock %}">
                    <i class="fas fa-chart-bar"></i>
                    <span>Submissions & Grading</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <div class="user-mini-card">
                <div class="user-avatar" style="background:var(--secondary);">
                    <i class="fas fa-user-tie"></i>
                </div>
                <div class="user-info">
                    <div class="user-name">{{ user_name }}</div>
                    <div class="user-role-label">Faculty Educator</div>
                </div>
            </div>
            <a href="{{ url_for('auth.logout') }}" class="sidebar-link" style="margin-top:0.5rem; color:#ef4444;">
                <i class="fas fa-sign-out-alt"></i>
                <span>Sign Out</span>
            </a>
        </div>
    </aside>

    <!-- Main Content Stage -->
    <div class="app-main">
        <header class="app-topbar">
            <div class="topbar-left">
                <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
                <div class="topbar-search">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search exams, questions, submissions..." />
                </div>
            </div>

            <div class="topbar-right">
                <button class="theme-toggle-btn" title="Toggle Theme"><i class="fas fa-moon"></i></button>

                <div class="notification-wrapper">
                    <button class="icon-btn notification-bell-btn">
                        <i class="far fa-bell"></i>
                        <span class="icon-badge notification-badge" style="{% if not unread_notifications_count %}display:none;{% endif %}">{{ unread_notifications_count }}</span>
                    </button>
                    <div class="notification-dropdown">
                        <div class="notif-header">
                            <h4>Notifications</h4>
                        </div>
                        <ul class="notif-list">
                            <li style="padding:1rem; text-align:center; color:var(--text-muted);">Loading...</li>
                        </ul>
                    </div>
                </div>

                <div class="user-menu-wrapper">
                    <button class="user-menu-btn">
                        <div class="user-avatar" style="width:34px; height:34px; background:var(--secondary);">
                            <i class="fas fa-user-tie"></i>
                        </div>
                        <span style="font-size:0.875rem; font-weight:600; color:var(--text-main);">{{ user_name }}</span>
                        <i class="fas fa-chevron-down" style="font-size:0.75rem; color:var(--text-muted);"></i>
                    </button>
                    <div class="user-dropdown">
                        <a href="{{ url_for('auth.logout') }}" style="color:#ef4444;"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </div>
                </div>
            </div>
        </header>

        <main class="app-content">
            {% block teacher_content %}{% endblock %}
        </main>
    </div>
</div>
{% endblock %}
